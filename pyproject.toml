[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphon-control"
version = "0.1.0"
description = "Differentiable time-and-label control of graphon collective dynamics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Joseph K. Miller"}, {name = "Brandon Su"}]
dependencies = ["torch>=2.2", "numpy>=1.24", "matplotlib>=3.7", "tqdm>=4.66", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
graphon-kuramoto = "graphon_control.experiments.kuramoto:main"
graphon-opinions = "graphon_control.experiments.bounded_confidence:main"
graphon-train = "graphon_control.experiments.generic:main"

[tool.setuptools.packages.find]
include = ["graphon_control*"]

[tool.setuptools]
py-modules = ["model_1", "model_1_viz", "e1_kuramoto", "e2_bc", "e1_msweep", "e1_noise_figure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
