name: Numerical checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
      - run: python e1_kuramoto.py --smoke --no-plots --no-mirror --out-root smoke-results
      - run: python e2_bc.py --smoke --no-plots --no-mirror --out-root smoke-results
